<style>
:root{
  --bg:#151517; --bg-2:#1b1b1e; --ink:#ededed; --muted:#a1a1a1; --dim:#6e6e73;
  --line:rgba(255,255,255,.12); --chip:rgba(255,255,255,.04);
  --gutter:clamp(16px,2.6vw,28px);
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;
  --serif:"Newsreader","Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:6px}
.hero{position:relative;min-height:100vh;min-height:100svh;isolation:isolate;overflow:hidden;background:var(--bg)}
.stage{position:absolute;inset:0;z-index:-1;touch-action:pan-y;opacity:0;animation:fade 1.6s .2s ease forwards}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{mix-blend-mode:screen}
@keyframes fade{to{opacity:1}}
.nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px var(--gutter);height:64px}
.brand{display:flex;align-items:center;gap:14px}
.brand a{display:inline-flex;align-items:center}
.brand-slash{color:var(--dim);font-size:22px;font-weight:300;transform:translateY(-1px);line-height:1}
.brand-name{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:-.01em;line-height:1}
.links{display:flex;gap:20px;margin-left:12px}
.links a{font-size:14px;color:var(--muted);transition:color .2s}
.links a:hover{color:var(--ink)}
.right{display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;justify-content:space-between;gap:28px;height:36px;padding:0 6px 0 12px;min-width:172px;border:1px solid var(--line);border-radius:8px;background:var(--chip);font-size:14px;color:var(--muted);transition:border-color .2s,color .2s}
.search:hover{border-color:rgba(255,255,255,.22);color:var(--ink)}
kbd{font-family:var(--sans);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 5px;background:rgba(255,255,255,.03);line-height:1.4}
.ask{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:500;background:var(--chip);transition:background .2s,border-color .2s}
.ask:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;transition:background .2s}
.icon-btn:hover{background:rgba(255,255,255,.06)}
.menu{display:none}
.copy{position:relative;z-index:1;min-height:calc(100svh - 64px);display:flex;flex-direction:column;justify-content:center;padding:0 var(--gutter) 64px;max-width:560px;pointer-events:none}
.copy>*{pointer-events:auto}
.wordmark{font-family:var(--serif);font-weight:400;font-size:clamp(72px,8.6vw,124px);line-height:.9;letter-spacing:-.035em;font-variation-settings:"opsz" 72;margin-bottom:clamp(14px,1.8vw,22px)}
.lede{font-size:clamp(28px,3.05vw,44px);line-height:1.2;font-weight:400;letter-spacing:-.025em;margin-bottom:clamp(24px,2.6vw,36px)}
.lede span{display:block}
.tabs{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:14px;flex-wrap:wrap}
.tab{color:var(--dim);padding:2px 0;transition:color .2s}
.tab:hover{color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink)}
.dot{color:var(--dim);font-size:11px}
.cmd{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:440px;padding-top:14px;font-size:15px;line-height:1.5}
.cmd::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.28),rgba(255,255,255,.08) 70%,transparent)}
.cmd-text{transition:opacity .18s,transform .18s;min-width:0}
.cmd-text.swap{opacity:0;transform:translateY(3px)}
.copy-btn{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:7px;color:var(--dim);transition:color .2s,background .2s}
.copy-btn:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.copy-btn .ok{display:none}
.copy-btn.done .ok{display:block}
.copy-btn.done .cp{display:none}
.rise{opacity:0;transform:translateY(12px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.copy>*:nth-child(2){animation-delay:.08s}
.copy>*:nth-child(3){animation-delay:.16s}
.copy>*:nth-child(4){animation-delay:.24s}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-width:960px){.search{min-width:0;gap:14px}}
@media (max-width:820px){
  .links,.search,.ask{display:none}
  .menu{display:grid}
  .copy{justify-content:flex-start;min-height:0;padding-top:clamp(28px,7svh,64px);padding-bottom:0;max-width:100%}
  .hero{min-height:max(100svh,720px)}
}
@media (max-width:420px){.tabs{font-size:14px;gap:6px}.cmd{font-size:14px}}
@media (prefers-reduced-motion:reduce){
  .rise{opacity:1;transform:none;animation:none}
  .stage{opacity:1;animation:none}
}

<script>
(function(){
  var cmd=document.getElementById('cmd'), tabs=[].slice.call(document.querySelectorAll('.tab')), btn=document.getElementById('copy'), timer=null;
  tabs.forEach(function(tab){
    tab.addEventListener('click',function(){
      tabs.forEach(function(t){t.setAttribute('aria-selected',t===tab?'true':'false');});
      cmd.classList.add('swap');
      setTimeout(function(){ cmd.textContent=tab.getAttribute('data-cmd'); cmd.classList.remove('swap'); },160);
    });
  });
  btn.addEventListener('click',function(){
    try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(cmd.textContent); }catch(e){}
    btn.classList.add('done'); clearTimeout(timer);
    timer=setTimeout(function(){btn.classList.remove('done');},1400);
  });
})();
</script>

const stage=document.querySelector('.stage');

const fxCanvas=document.getElementById('fx');

const copyEl=document.querySelector('.copy');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const off=document.createElement('canvas'); const offCtx=off.getContext('2d');

function vsub(a,b){return{x:a.x-b.x,y:a.y-b.y};}

  R=S/Math.sqrt(3);
  const top={x:cx,y:cy-R},right={x:cx+S/2,y:cy+R/2},left={x:cx-S/2,y:cy+R/2};
  tri=[top,right,left];
  const cent={x:cx,y:cy};

    const e=vsub(d[1],d[0]); let n={x:e.y,y:-e.x}; n=vnorm(n);

computeLayout();

/* ---------- spectrum ---------- */
const NWL=72, wavelengths=[], vivid=[], balanced=[], weights=[];
(function(){
  let sum={r:0,g:0,b:0}; const raw=[];

    else if(nm<510){ g=1; b=(510-nm)/20; }
    else if(nm<580){ r=(nm-510)/70; g=1; }

function refract2(I,N,eta){

/* ---------- lamp + tracing ---------- */
function lampFor(aim){

/* ---------- light drawing ---------- */
let projectPt=function(p){return p;};
const motes=[];

  if((mobile||idle)&&!reduced){
    const a=now/1000*(Math.PI*2/18);
    tx=0.5+0.34*Math.cos(a); ty=0.5+0.34*Math.sin(a);
    if(mobile) useOrbit=false;
  }
  if(mobile) useOrbit=false;
  aim[0]=ease(aim[0],ty,0.12,dt); aim[1]=ease(aim[1],tx,0.12,dt);
  const oTx=useOrbit?orbitT.x:0, oTy=useOrbit?orbitT.y:0;
  orbit.x=ease(orbit.x,oTx,0.08,dt); orbit.y=ease(orbit.y,oTy,0.08,dt);
  if(glOK){
    const D=(H/2)/Math.tan(24*Math.PI/180);
    const yaw=orbit.x*3.5*Math.PI/180, pitch=-orbit.y*3.5*Math.PI/180;
    camera.position.set(D*Math.sin(yaw)*Math.cos(pitch), D*Math.sin(pitch), D*Math.cos(yaw)*Math.cos(pitch));
    camera.lookAt(0,0,0);
    camera.setViewOffset(W,H, W/2-cx, H/2-cy, W,H);
    camera.updateProjectionMatrix();
    // view-proj for exit-point sampling (object space == world space here)
    const vp=new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);
    frontMat.uniforms.uViewProj.value.copy(vp);
    drawLight(now,aim);
    lightTex.needsUpdate=true;
    renderer.setRenderTarget(rt); renderer.setViewport(0,0,Math.round(W*LDPR),Math.round(H*LDPR));
    renderer.render(initGL.bgScene,dummyCam);
    backMesh.visible=true; prismMesh.visible=false;
    renderer.render(scene,camera);
    renderer.setRenderTarget(null); renderer.setViewport(0,0,Math.round(W*LDPR),Math.round(H*LDPR));
    renderer.render(initGL.copyScene,dummyCam);
    backMesh.visible=false; prismMesh.visible=true;
    renderer.render(scene,camera);
  }else{
    drawLight(now,aim);
  }
}
requestAnimationFrame(frame);
</script>
